<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- "monospace" -> CozetteVector (TTF), чтобы генерик-имя тоже давало Cozette -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>CozetteVector</family>
    </prefer>
  </alias>

  <!-- "Cozette" - это битмап .pcf/.otb, его не умеют Wayland-приложения.
       Подменяем на масштабируемый CozetteVector. -->
  <match target="pattern">
    <test name="family">
      <string>Cozette</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>CozetteVector</string>
    </edit>
  </match>
</fontconfig>
