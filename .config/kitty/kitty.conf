include themes/noctalia.conf

# CozetteVector - это TTF-версия Cozette (битмап .pcf/.otb Wayland-приложения не умеют)
font_family CozetteVector
# отдельная семья для жирного начертания (в Cozette bold - отдельный файл)
bold_font CozetteVectorBold
font_size 12

# В системе не установлен xdg-utils (нет xdg-open), поэтому kitty не мог
# открывать ссылки вообще. Указываем браузер напрямую.
# Клик по ссылке в kitty: Ctrl+Shift+LeftClick (обычный клик ничего не делает).
# Если поставишь xdg-utils, строку ниже можно убрать.
open_url_with /usr/bin/firefox
